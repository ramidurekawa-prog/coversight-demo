# Same posture as the platform monorepo (ADR-0010): latest stable, but only
# releases at least 14 days old.
minimumReleaseAge: 20160
allowBuilds:
  # drizzle-kit's bundler (dev only).
  esbuild: true
  sharp: true


# Conscious exception: next <=16.4.4 carries a published advisory, and next build
# refuses to finish on an affected version. 16.4.5 (the fixed patch, Nov 3) is a few
# hours short of the 14-day gate on 2026-11-17. Drop these once it ages past it.
minimumReleaseAgeExclude:
  - next@16.4.5
  - '@next/env@16.4.5'
  - '@next/swc-darwin-arm64@16.4.5'
  - '@next/swc-darwin-x64@16.4.5'
  - '@next/swc-linux-arm64-gnu@16.4.5'
  - '@next/swc-linux-arm64-musl@16.4.5'
  - '@next/swc-linux-x64-gnu@16.4.5'
  - '@next/swc-linux-x64-musl@16.4.5'
  - '@next/swc-win32-arm64-msvc@16.4.5'
  - '@next/swc-win32-x64-msvc@16.4.5'
